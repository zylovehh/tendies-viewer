name: 编译未签名 IPA

# 手动触发为主；推到 main 也自动编一次，方便换 index.html 后直接拿新包。
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # 原版静态包：仓库里只存一个 caplayground-out.zip（3.7MB），编之前解开成
      # TendiesViewer/caplayground/，Xcode 的文件夹引用才能把它原样拷进 .app。
      - name: Unzip CAPlayground static export
        run: |
          ls -lh caplayground-out.zip || echo "no caplayground-out.zip, using single index.html"
          if [ -f caplayground-out.zip ]; then
            rm -rf out TendiesViewer/caplayground
            unzip -o caplayground-out.zip
            mv out TendiesViewer/caplayground
            ls TendiesViewer/caplayground | head -20
            test -f TendiesViewer/caplayground/viewer.html
            test -f TendiesViewer/caplayground/editor/demo.html
          fi

      - name: Build for generic iOS device (no signing)
        run: |
          xcodebuild \
            -project TendiesViewer.xcodeproj \
            -scheme TendiesViewer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # .app -> Payload/*.app -> zip 成 .ipa（这就是未签名 IPA 的标准结构）。
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          echo "APP_PATH=$APP_PATH"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r TendiesViewer-unsigned.ipa Payload
          ls -lh TendiesViewer-unsigned.ipa
          unzip -l TendiesViewer-unsigned.ipa | head -20

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TendiesViewer-unsigned-ipa
          path: TendiesViewer-unsigned.ipa
          if-no-files-found: error
